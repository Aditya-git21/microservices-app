name: CI/CD Pipeline

on:
  push:
    branches: [main]

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 194528795408.dkr.ecr.us-east-1.amazonaws.com
  ECS_CLUSTER: microservices-cluster

jobs:
  build-and-push:
    name: Build and Push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push gateway
        run: |
          docker build -t $ECR_REGISTRY/microservices/gateway:${{ github.sha }} ./gateway
          docker push $ECR_REGISTRY/microservices/gateway:${{ github.sha }}
          docker tag $ECR_REGISTRY/microservices/gateway:${{ github.sha }} $ECR_REGISTRY/microservices/gateway:latest
          docker push $ECR_REGISTRY/microservices/gateway:latest

      - name: Build and push auth-service
        run: |
          docker build -t $ECR_REGISTRY/microservices/auth-service:${{ github.sha }} ./services/auth-service
          docker push $ECR_REGISTRY/microservices/auth-service:${{ github.sha }}
          docker tag $ECR_REGISTRY/microservices/auth-service:${{ github.sha }} $ECR_REGISTRY/microservices/auth-service:latest
          docker push $ECR_REGISTRY/microservices/auth-service:latest

      - name: Build and push user-service
        run: |
          docker build -t $ECR_REGISTRY/microservices/user-service:${{ github.sha }} ./services/user-service
          docker push $ECR_REGISTRY/microservices/user-service:${{ github.sha }}
          docker tag $ECR_REGISTRY/microservices/user-service:${{ github.sha }} $ECR_REGISTRY/microservices/user-service:latest
          docker push $ECR_REGISTRY/microservices/user-service:latest

      - name: Build and push order-service
        run: |
          docker build -t $ECR_REGISTRY/microservices/order-service:${{ github.sha }} ./services/order-service
          docker push $ECR_REGISTRY/microservices/order-service:${{ github.sha }}
          docker tag $ECR_REGISTRY/microservices/order-service:${{ github.sha }} $ECR_REGISTRY/microservices/order-service:latest
          docker push $ECR_REGISTRY/microservices/order-service:latest

      - name: Build and push notification-service
        run: |
          docker build -t $ECR_REGISTRY/microservices/notification-service:${{ github.sha }} ./services/notification-service
          docker push $ECR_REGISTRY/microservices/notification-service:${{ github.sha }}
          docker tag $ECR_REGISTRY/microservices/notification-service:${{ github.sha }} $ECR_REGISTRY/microservices/notification-service:latest
          docker push $ECR_REGISTRY/microservices/notification-service:latest

  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify structure
        run: |
          echo "Checking service files exist..."
          test -f services/auth-service/main.py && echo "auth-service ok"
          test -f services/order-service/main.py && echo "order-service ok"
          test -f services/user-service/main.py && echo "user-service ok"
          test -f services/notification-service/main.py && echo "notification-service ok"
          test -f gateway/main.py && echo "gateway ok"
          test -f infra/docker-compose.yml && echo "docker-compose ok"
          echo "All checks passed"
